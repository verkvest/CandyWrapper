# Export the Godot iOS project, archive it, and upload to TestFlight.
# Signing uses the App Store Connect API key (cloud-managed certificates).
# Skips signing and upload when the secrets are absent, but still exports and archives.
#
# Secrets (GitHub → Settings → Secrets → Actions; never commit them):
#   APPSTORE_API_KEY_P8      raw PEM or base64 of AuthKey_<KEYID>.p8
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
# The key needs Admin or App Manager so Xcode can create the distribution cert
# and profile. The App Store Connect app record for the bundle id must exist
# before the first upload; this workflow registers the bundle id if it is missing.
name: ios-testflight

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  TEAM_ID: 38PT254HDZ
  BUNDLE_ID: es.verkvest.liltkin
  APP_VERSION: "0.1.0"
  GODOT_VERSION: "4.7.2"

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::App Store Connect API key secrets are not set. The Xcode project will still be exported and archived unsigned. Signing and TestFlight upload are skipped."
          fi

      - uses: actions/checkout@v4

      - name: Tools + Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-templates-v1

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-cache"
          cd "$RUNNER_TEMP/godot-cache"
          curl -fsSL -o editor.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q editor.zip
          rm -rf templates
          unzip -q templates.tpz
          rm -f editor.zip templates.tpz

      - name: Install export templates
        run: |
          set -euo pipefail
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/godot-cache/templates/." "$DEST/"
          # Godot.app may be nested one directory down depending on the zip layout.
          APP=$(find "$RUNNER_TEMP/godot-cache" -type d -name 'Godot*.app' | head -1)
          [ -n "$APP" ]
          xattr -dr com.apple.quarantine "$APP" || true
          echo "GODOT_BIN=$APP/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          "$APP/Contents/MacOS/Godot" --version

      - name: Stamp build number
        run: |
          set -euo pipefail
          # CFBundleVersion / Godot application/version. Digits only.
          perl -i -pe 's/^application\/version=.*/application\/version="${{ github.run_number }}"/' export_presets.cfg
          perl -i -pe 's/^application\/short_version=.*/application\/short_version="${{ env.APP_VERSION }}"/' export_presets.cfg
          grep -n 'application/version=\|application/short_version=\|bundle_identifier' export_presets.cfg

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" "build/ios/Liltkin.ipa"
          find build/ios -maxdepth 3 -type d -name '*.xcodeproj' -o -name '*.plist' | head -40

      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Register bundle id if missing
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          BUNDLE_NAME: Liltkin
        run: |
          set -euo pipefail
          python3 -m pip install --user pyjwt cryptography
          export APPSTORE_KEY_PATH="$KEYFILE"
          python3 tools/asc_ensure_bundle_id.py

      - name: Patch Info.plist
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r plist; do
            found=1
            echo "patch $plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${APP_VERSION}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist" \
              || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"
            /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" || true
          done < <(find build/ios -name 'Info.plist' -o -name '*-Info.plist')
          [ "$found" = 1 ]

      - name: Archive (unsigned; signing happens at export)
        run: |
          set -euo pipefail
          PROJ=$(find build/ios -name '*.xcodeproj' | head -1)
          [ -n "$PROJ" ]
          echo "project $PROJ"
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f && NF{print; exit}')
          echo "scheme $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Liltkin.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO INSTALL_PATH=/Applications \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -80
          test ${PIPESTATUS[0]} -eq 0
          find "$RUNNER_TEMP/Liltkin.xcarchive" -maxdepth 3 | head -30
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/Liltkin.xcarchive/Info.plist"

      - name: Export with App Store distribution signing and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Liltkin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          if grep -q "ERROR" "$RUNNER_TEMP/upload.log"; then
            if grep -Eq "Cannot determine the Apple ID|No suitable application records were found|does not exist" "$RUNNER_TEMP/upload.log"; then
              echo "::error::No App Store Connect app record for ${BUNDLE_ID} yet. Create it in App Store Connect → Apps → New App (bundle id ${BUNDLE_ID}, SKU liltkin), then re-run this workflow. The bundle id is registered automatically; the app record cannot be created via the API."
            else
              echo "::error::TestFlight upload failed. See the upload log."
            fi
            exit 1
          fi
          echo "::notice::Uploaded ${BUNDLE_ID} ${APP_VERSION} (${{ github.run_number }}) to App Store Connect"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore

      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
